[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-hermes-bridge-lab"
version = "0.1.0"
description = "Minimal OKF graph retrieval bridge for a Hermes pre_llm_call hook"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
okf-hermes-lab = "okf_hermes_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

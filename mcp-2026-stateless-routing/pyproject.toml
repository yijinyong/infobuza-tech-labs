[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stateless-routing-lab"
version = "1.0.0"
description = "Reproducible routing-dependency lab for MCP 2026-07-28"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "JY Lee"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mcp-routing-lab = "mcp_routing_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
